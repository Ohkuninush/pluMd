name: Compilar y publicar

# - En cada Pull Request hacia main: compila el portable para comprobar que funciona y lo guarda 7 días como artefacto.
# - Al subir una etiqueta vX.Y.Z (por ejemplo v0.1.0): compila y publica una versión en GitHub con el portable
#   y sus sumas de comprobación.
on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    permissions:
      contents: write # solo se usa para crear la versión al publicar una etiqueta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Comprobar que la etiqueta coincide con la versión
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $v de package.json"
            exit 1
          fi

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la interfaz
        run: node scripts/build.js

      - name: Empaquetar el portable
        run: npx electron-builder --win portable --publish never

      - name: Sumas de comprobación
        shell: bash
        run: |
          cd release
          sha256sum PluMd-portable-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Guardar el resultado (solo pruebas)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: PluMd-portable
          path: |
            release/PluMd-portable-*.exe
            release/SHA256SUMS.txt
          retention-days: 7

      - name: Publicar la versión
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/PluMd-portable-*.exe release/SHA256SUMS.txt \
            --title "PluMd ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            --verify-tag
